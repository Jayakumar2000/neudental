<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page Not Found | Neudental</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --navy: #0B1341;
        --ink: #0B3B60;
        --cyan: #3AC3E6;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(160deg, #ffffff 0%, #F5F8FA 60%, #EEF5FC 100%);
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--ink);
        padding: 24px;
      }
      .card { max-width: 480px; text-align: center; }
      .logo { height: 40px; width: auto; margin-bottom: 40px; }
      .code {
        font-family: 'Playfair Display', serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1;
        color: var(--navy);
        margin: 0;
      }
      h1 {
        font-family: 'Playfair Display', serif;
        font-size: 26px;
        color: var(--navy);
        margin: 16px 0 12px;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #5b6b7a;
        margin: 0 0 32px;
      }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 16px 32px;
        border-radius: 12px;
        transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease;
      }
      a.btn.primary { background: var(--navy); color: #fff; }
      a.btn.primary:hover { background: var(--cyan); color: var(--navy); transform: translateY(-2px); }
      a.btn.secondary { border: 1px solid rgba(11, 19, 65, 0.15); color: var(--navy); }
      a.btn.secondary:hover { background: rgba(11, 19, 65, 0.05); transform: translateY(-2px); }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="/brand/neudental-wordmark.png" alt="Neudental" />
      <p class="code">404</p>
      <h1>This link looks broken</h1>
      <p>The page you were looking for doesn't exist or may have moved. Let's get you back to the Neudental homepage.</p>
      <div class="actions">
        <a class="btn primary" href="/">&larr; Back to Home</a>
        <a class="btn secondary" href="tel:+919342367446">Call the Clinic</a>
      </div>
    </div>
  </body>
</html>
