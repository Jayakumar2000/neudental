    <!-- Fonts: preconnect warms the connection while the rest of <head> is still
    parsing, and a <link rel="stylesheet"> (unlike a CSS @import) can start
    fetching immediately instead of blocking on index.css first. Weights are
    trimmed to what the app actually uses (grep-audited), not the family defaults. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

      gtag('config', 'AW-18023171134');
    </script>

    <!-- FAQPage structured data -- mirrors src/data.ts FAQS (kept in sync by
    hand; update both if a question changes). This is the single highest-value
    block for AEO/GEO: it's exactly the format Google's featured snippets, AI

    conversational "near me" queries. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",

          "@type": "Question",
