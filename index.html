<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The site has one, light design. "only light" tells browsers with an
         automatic dark mode (Chrome, Edge, Brave, Opera) not to repaint it, which
         hid the navy half of the logo and other elements. Samsung Internet's
         default dark mode ignores it. -->
    <meta name="color-scheme" content="only light" />

    <!-- Fonts: preconnect warms the connection while the rest of <head> is still
    parsing, and a <link rel="stylesheet"> (unlike a CSS @import) can start
    fetching immediately instead of blocking on index.css first. Weights are
    trimmed to what the app actually uses (grep-audited), not the family defaults. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />

    <!-- Google tag (gtag.js) and Microsoft Clarity -- one shared gate, so
    there's exactly one place either tag can be loaded from and no risk of a
    duplicate tag creeping in elsewhere. page_view itself is fully manual
    (src/lib/analytics.ts trackPageView). Reasons:
      1. /admin (staff-only CRM, and a magnet for bots probing for a login
         page) and Google's own ?gtm_latency= tag-health checks skip loading
         both tags entirely -- not just GA4's page_view, so neither GA4's
         enhanced measurement (session_start, scroll, etc.) nor a Clarity
         recording ever starts for that hit, and neither shows up as a
         "user"/session.
      2. Everywhere else, GA4's send_page_view:false hands page_view to the
         app instead of GA4's automatic/history-based tracking -- per
         Google's own SPA guidance, this disables both, not just the one on
         load. The app is the only thing that knows a /blogs/:id slug is
         real, so it's the only thing that can decide whether a GA4 hit
         should count at all (App-v1.tsx's page-meta effect skips
         trackPageView for a route it classifies as Not Found). Clarity has
         no equivalent hand-off -- it starts recording as soon as it loads,
         before the app has classified the route -- so App-v1.tsx also calls
         window.clarity('stop') the moment it lands on Not Found, cutting
         a bot-probed fake blog slug's recording short instead of letting it
         run.
    Google Ads config is skipped along with GA4/Clarity on excluded paths,
    since a bot or a staff login was never going to be an ad conversion
    either. Clarity tracks SPA route changes on its own via the History API,
    so nothing further is needed for it to see /blogs, /blogs/:id etc. as
    separate pages within the one session. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      var neuPath = location.pathname.replace(/\/+$/, '') || '/';
      var neuAnalyticsExcluded =
        neuPath === '/admin' || /[?&]gtm_latency=/.test(location.search);

      if (!neuAnalyticsExcluded) {
        var neuGtagScript = document.createElement('script');
        neuGtagScript.async = true;
        neuGtagScript.src = 'https://www.googletagmanager.com/gtag/js?id=G-N6NS2ZXG78';
        document.head.appendChild(neuGtagScript);

        gtag('js', new Date());
        gtag('config', 'G-N6NS2ZXG78', { send_page_view: false });

        // Google Ads conversion tracking. Configured alongside GA4 on the same
        // gtag instance so ad clicks get a _gcl cookie and conversion events fired
        // from the app (src/lib/analytics.ts) can be attributed back to a campaign.
        gtag('config', 'AW-18023171134');

        // Microsoft Clarity: session recordings + heatmaps.
        (function (c, l, a, r, i, t, y) {
          c[a] = c[a] || function () { (c[a].q = c[a].q || []).push(arguments); };
          t = l.createElement(r); t.async = 1; t.src = 'https://www.clarity.ms/tag/' + i;
          y = l.getElementsByTagName(r)[0]; y.parentNode.insertBefore(t, y);
        })(window, document, 'clarity', 'script', 'ykqtp15nru');
      }
    </script>

    <!-- Brand: neudental — Modern Dental Care for Confident Smiles -->
    <meta name="keywords" content="best dentist near me, dentist near me, dental clinic near me, family dentist near me, best dentist in Chennai, dental clinic Kodungaiyur, dentist in Kodungaiyur, root canal treatment near me, RCT Chennai, teeth whitening near me, dental implants near me, Invisalign Kodungaiyur, braces near me, pediatric dentist near me, emergency dentist near me, Dr Swetha dentist, Bludental, Bludental Kodungaiyur" />
    <meta name="author" content="neudental" />

    <!-- Per-page head. Everything between these two markers is rewritten for
    each page at build time (scripts/prerender.mjs, from getRouteMeta() in
    src/lib/seo.ts) and kept in step on in-app navigation by setPageMeta().
    That includes all structured data: the clinic, Dr. Swetha and the website
    (siteJsonLd() in src/lib/schema.ts, built from src/data.ts) plus each
    page's own graph. What is here is only the homepage default the dev
    server shows. Don't edit titles, descriptions or schema here -- change
    src/data.ts or src/lib/seo.ts / schema.ts instead. -->
    <!-- route-head:start -->
    <title>Neudental | Family Dental Clinic in Kodungaiyur, Chennai</title>
    <meta name="description" content="Neudental — a trusted family dental clinic in Kodungaiyur, Chennai, rated among the best dentists near you in North Chennai. Painless root canal treatment (RCT), Invisalign clear aligners, teeth whitening and dental implants, by Dr. Swetha BDS, FGDS." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.neudental.in/" />
    <!-- route-head:end -->

    <!-- Favicons & app icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0B1341" />
    <meta name="apple-mobile-web-app-title" content="neudental" />
    <meta name="application-name" content="neudental" />

    <!-- Open Graph / Twitter: sitewide parts only. Each page's title,
    description, URL and image are in the per-page block above. -->
    <meta property="og:site_name" content="neudental" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Blog feed, for feed readers and answer engines that discover new
    posts through RSS. Generated at build time from src/data.ts. -->
    <link rel="alternate" type="application/rss+xml" title="Neudental Dental Health Blog" href="/blogs/rss.xml" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-v1.tsx"></script>
  </body>
</html>
